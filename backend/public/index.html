<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sonusX32</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2323272e'/%3E%3Crect x='3' y='6' width='2' height='7' fill='%2346b35a'/%3E%3Crect x='7' y='3' width='2' height='10' fill='%2346b35a'/%3E%3Crect x='11' y='8' width='2' height='5' fill='%2346b35a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --plate: #e4e6e9;   /* brushed faceplate */
      --panel: #f4f5f6;
      --console: #23272e; /* console bed */
      --ink: #1f2329;
      --muted: #5d6570;
      --line: #c9cdd3;
      --scene: #3d7dd8;   /* scribble-strip colors */
      --rec: #d9483b;
      --other: #d99a12;
      --led: #46b35a;
      --display: 'Barlow Condensed', 'Avenir Next Condensed', 'Arial Narrow', sans-serif;
      --body: 'Barlow', 'Avenir Next', system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --plate: #1b1e23; --panel: #252930; --ink: #e8eaed; --muted: #9aa2ad; --line: #363b44; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--plate); color: var(--ink); font: 17px/1.5 var(--body); }

    header { background: var(--console); color: #f1f2f4; padding: 28px 16px 22px; }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font: 700 clamp(3rem, 12vw, 5.5rem)/0.9 var(--display); margin: 0; letter-spacing: -0.01em; }
    header p { margin: 8px 0 0; color: #aab1bb; }

    /* Meter bridge: one LED column per X32 input channel. */
    .meters { display: grid; grid-template-columns: repeat(32, 1fr); gap: 3px; height: 44px; margin-top: 22px; align-items: end; }
    .meters i { display: block; height: 100%;
      background: linear-gradient(to top, var(--led) 0 70%, #e3c32a 70% 88%, var(--rec) 88%);
      clip-path: inset(calc(100% - var(--h)) 0 0 0); transform-origin: bottom; }
    @media (prefers-reduced-motion: no-preference) {
      .meters i { animation: hit 1.4s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--n) * 22ms); }
      @keyframes hit { 0% { transform: scaleY(0); } 45% { transform: scaleY(1.25); } 100% { transform: scaleY(1); } }
    }

    main { padding: 28px 16px 64px; }
    .drop { display: grid; gap: 12px; justify-items: start; padding: 22px; border: 2px dashed var(--line); border-radius: 10px; background: var(--panel); transition: border-color .15s, background .15s; }
    .drop.over { border-color: var(--scene); background: color-mix(in srgb, var(--scene) 10%, var(--panel)); }
    .drop strong { font: 600 1.6rem/1.1 var(--display); }
    .drop span { color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    input[type=file] { font: inherit; color: var(--muted); max-width: 100%; }
    button { font: 600 1.05rem var(--display); letter-spacing: .02em; border: 0; border-radius: 6px; padding: 8px 18px; cursor: pointer; background: var(--console); color: #fff; }
    @media (prefers-color-scheme: dark) { button { background: #f1f2f4; color: #23272e; } }
    button.del { background: transparent; color: var(--muted); padding: 6px 10px; }
    button.del:hover { color: var(--rec); }
    :focus-visible { outline: 3px solid var(--scene); outline-offset: 2px; }

    #msg { min-height: 1.5em; margin: 12px 2px 0; font-weight: 500; }
    #msg.err { color: var(--rec); }

    h2 { font: 600 1.6rem var(--display); margin: 16px 0 10px; }
    ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
    li { display: flex; align-items: center; gap: 14px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
    li .tag { flex: none; width: 74px; font: 600 .95rem var(--display); text-align: center; color: #fff; border-radius: 4px; padding: 2px 0; background: var(--c); }
    li a { flex: 1; color: inherit; overflow-wrap: anywhere; text-underline-offset: 3px; }
    .empty { color: var(--muted); justify-content: center; padding: 28px 4px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>sonusX32</h1>
      <p>Scenes and recordings for the X32, in one place nobody can overwrite.</p>
      <div class="meters" aria-hidden="true"></div>
    </div>
  </header>

  <main>
    <div class="wrap">
    <form id="upload" class="drop">
      <strong>Drop a scene or recording here</strong>
      <span>Or choose one. Files with a name that's already taken are refused, so nobody's work gets replaced.</span>
      <div class="row">
        <input type="file" name="file" required aria-label="Scene or recording file">
        <button>Upload file</button>
      </div>
    </form>
    <p id="msg" role="status"></p>

    <h2>Files</h2>
    <ul id="files"></ul>
    </div>
  </main>

  <script>
    const msg = document.getElementById('msg');
    const list = document.getElementById('files');
    const form = document.getElementById('upload');
    const say = (text, err) => { msg.textContent = text; msg.className = err ? 'err' : ''; };

    // A static, slightly random meter bridge — it hits once on load, then rests.
    document.querySelector('.meters').append(...Array.from({ length: 32 }, (_, n) => {
      const i = document.createElement('i');
      i.style.setProperty('--n', n);
      i.style.setProperty('--h', `${30 + Math.round(60 * Math.abs(Math.sin(n * 1.7 + 0.4)))}%`);
      return i;
    }));

    const kinds = [
      [/\.(scn|snp|chn|efx|rou|lib)$/i, 'Scene', 'var(--scene)'],
      [/\.(wav|mp3|aif|aiff|flac|m4a)$/i, 'Recording', 'var(--rec)'],
      [/./, 'File', 'var(--other)'],
    ];

    async function refresh() {
      const files = await (await fetch('/list')).json();
      if (!files.length) {
        list.innerHTML = '<li class="empty">Nothing here yet. Upload your first scene above.</li>';
        return;
      }
      list.replaceChildren(...files.map((name) => {
        const [, label, color] = kinds.find(([re]) => re.test(name));
        const li = document.createElement('li');
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = label;
        tag.style.setProperty('--c', color);
        const a = document.createElement('a');
        a.href = '/files/' + encodeURIComponent(name);
        a.textContent = name;
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = 'Delete';
        del.setAttribute('aria-label', `Delete ${name}`);
        del.onclick = async () => {
          if (!confirm(`Delete "${name}"? This can't be undone.`)) return;
          const res = await fetch('/delete/' + encodeURIComponent(name), { method: 'DELETE' });
          const body = await res.json();
          say(res.ok ? `Deleted "${name}"` : body.error, !res.ok);
          refresh();
        };
        li.append(tag, a, del);
        return li;
      }));
    }

    async function send(data) {
      const res = await fetch('/upload', { method: 'POST', body: data });
      const body = await res.json();
      say(res.ok ? `Uploaded "${body.fileName}"` : body.error, !res.ok);
      if (res.ok) form.reset();
      refresh();
    }

    form.onsubmit = (e) => { e.preventDefault(); send(new FormData(form)); };

    form.ondragover = (e) => { e.preventDefault(); form.classList.add('over'); };
    form.ondragleave = () => form.classList.remove('over');
    form.ondrop = (e) => {
      e.preventDefault();
      form.classList.remove('over');
      const file = e.dataTransfer.files[0];
      if (!file) return;
      const data = new FormData();
      data.append('file', file);
      send(data);
    };

    refresh();
  </script>
</body>
</html>
